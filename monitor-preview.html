<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>v10.0 监控面板预览 v2</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body { padding-bottom: 40px; }
    .preview-badge {
      position: fixed; top: 10px; right: 10px; z-index: 999;
      background: #0071e3; color: #fff; padding: 4px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
    }
    .acct-scroll { display:flex; gap:10px; padding:10px 16px 0; overflow-x:auto; scrollbar-width:none; }
    .acct-scroll::-webkit-scrollbar { display:none; }
    .monitor-card {
      flex:0 0 135px; background:#fff; border-radius:12px; padding:12px 14px;
      box-shadow:0 2px 12px rgba(0,0,0,0.06); position:relative; cursor:pointer;
      border:2px solid transparent; transition:all 0.2s;
    }
    .monitor-card.selected { border-color:#0071e3; box-shadow:0 0 0 3px rgba(0,113,227,0.12); }
    .monitor-card.all { border-style:dashed; border-color:#d0d0d5; }
    .monitor-card.all.selected { border-color:#0071e3; }
    .mc-platform { font-size:11px; font-weight:600; color:#86868b; margin-bottom:4px; }
    .mc-fans { font-size:17px; font-weight:800; color:#1d1d1f; }
    .mc-delta { font-size:11px; font-weight:600; margin-left:4px; }
    .mc-delta.up { color:#34c759; }
    .mc-delta.down { color:#ff3b30; }
    .mc-sub { font-size:10px; color:#aeaeb2; margin-top:2px; }
    .monitor-card.add {
      border:2px dashed #d0d0d5 !important; background:transparent; box-shadow:none;
      display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;
      cursor:pointer; color:#86868b; font-size:12px; font-weight:500;
    }
    .monitor-card.add .add-icon { font-size:24px; color:#0071e3; }
    .chart-card {
      background:#fff; border-radius:16px; padding:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin:10px 16px;
    }
    .chart-card h3 { font-size:14px; font-weight:700; margin-bottom:6px; color:#1d1d1f; }
    .chart-sub { font-size:11px; color:#86868b; margin-left:6px; font-weight:400; }
    canvas { display:block; }
    .trend-seg { display:flex; gap:4px; padding:0 16px 8px; }
    .tseg-btn {
      flex:1; padding:7px 0; border-radius:10px; font-size:12px; font-weight:600;
      border:1px solid #e5e5ea; background:#fff; color:#86868b; cursor:pointer; text-align:center;
    }
    .tseg-btn.active { background:#0071e3; color:#fff; border-color:#0071e3; }
    .week-group { margin:0 16px 12px; background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,0.04); }
    .week-head {
      display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
      cursor:pointer; user-select:none;
    }
    .week-head:active { background:#f5f5f7; }
    .week-head-left { display:flex; align-items:center; gap:10px; }
    .week-num { font-size:15px; font-weight:700; color:#1d1d1f; }
    .week-range { font-size:11px; color:#86868b; }
    .week-badge { font-size:12px; font-weight:600; color:#0071e3; background:#e8f2ff; border-radius:10px; padding:2px 10px; }
    .week-arrow { font-size:14px; color:#aeaeb2; transition:transform 0.2s; }
    .week-group.open .week-arrow { transform:rotate(180deg); }
    .week-body { display:none; padding:0 10px 10px; }
    .week-group.open .week-body { display:flex; flex-direction:column; gap:8px; }
    .work-link {
      display:block; width:100%; padding:10px 0; text-align:center; border:none;
      border-top:1px solid #e5e5ea; background:linear-gradient(180deg,#e8f4ff,#d6ebff);
      color:#1a6dd4; font-size:13px; font-weight:700; cursor:pointer; text-decoration:none;
      border-radius:0 0 14px 14px;
    }
    .acct-modal-bg {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:999;
      align-items:flex-end; justify-content:center; backdrop-filter:blur(3px);
    }
    .acct-modal-bg.show { display:flex; }
    .acct-modal {
      background:#fff; border-radius:20px 20px 0 0; width:100%; max-width:480px;
      padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
      animation:slideUp 0.3s ease;
    }
    @keyframes slideUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
    .acct-modal h3 { font-size:17px; font-weight:700; margin-bottom:14px; }
    .acct-modal .row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
    .acct-modal select, .acct-modal input {
      padding:10px 12px; border:1.5px solid #e5e5ea; border-radius:10px; font-size:14px;
      background:#f5f5f7; color:#1d1d1f; outline:none; font-family:inherit;
    }
    .acct-modal select { min-width:90px; }
    .acct-modal input { flex:1; min-width:120px; }
    .acct-modal input:focus, .acct-modal select:focus { border-color:#0071e3; }
    .btn-blue {
      width:100%; padding:13px; border:none; border-radius:10px; background:#0071e3;

    }
    .btn-grey {
      width:100%; padding:12px; border:1.5px solid #e5e5ea; border-radius:10px;
      background:#fff; color:#0071e3; font-size:14px; font-weight:500; cursor:pointer; margin-top:6px;

    .advice-row { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #f0f0f0; }
    .advice-row:last-child { border-bottom:none; }
    .advice-icon { font-size:20px; flex-shrink:0; }
    .advice-title { font-size:13px; font-weight:600; color:#1d1d1f; }

<script>

const ACCOUNT_DATA = {

      { title:'偷偷换了他的洗发水', likes:29000, plays:720000, date:'2026-07-18 19:30', week:29, url:'https://www.douyin.com/video/7656773111907807942' },
      { title:'假装把手机掉马桶里了', likes:24000, plays:650000, date:'2026-07-15 21:00', week:29, url:'https://www.douyin.com/video/7622658539152217009' },

  },
  a2: { // 我的小红书
    nickname:'我的小红书', platform:'xiaohongshu', userId:'95886844869', fans:[3000,5500,9800,18000,28000,42000,58000,72000,86400],
    allLabels: ['1月','2月','3月','4月','5月上','5月下','6月上','6月下','7/27'],
    trend30d: [58000,62000,68000,74000,80000,86400],
    labels30d: ['6/28','7/03','7/08','7/13','7/18','7/23'],
    trend7d: [72000,75000,78000,81000,83000,85000,86400],
    labels7d: ['7/21','7/22','7/23','7/24','7/25','7/26','7/27'],
    hourLikes: [60,40,25,15,10,8,12,35,100,220,350,450,550,650,620,500,440,580,700,880,950,820,600,300],
    delta: +1500, deltaUp: true, totalWorks: 8,
    works: [
      { title:'跟他说我怀孕了（吃多了）', likes:41000, plays:1200000, date:'2026-07-24 19:45', week:30, url:'https://www.xiaohongshu.com/explore/abc123' },
      { title:'给他手机存一百张丑表情包', likes:28000, plays:750000, date:'2026-07-22 18:30', week:30, url:'https://www.xiaohongshu.com/explore/def456' },
      { title:'让他帮选衣服，选的都是反的', likes:18000, plays:420000, date:'2026-07-16 20:00', week:29, url:'https://www.xiaohongshu.com/explore/ghi789' },
      { title:'假装有私生饭，他的反应绝了', likes:32000, plays:890000, date:'2026-07-09 19:15', week:28, url:'https://www.xiaohongshu.com/explore/jkl012' },
    ]
  },
  a3: { // 我的快手
    nickname:'我的快手', platform:'kuaishou', userId:'5530272280', fans:[10000,18000,25000,35000,45000,52300],
    allLabels: ['3月','4月','5月','6月上','6月下','7/27'],
    trend30d: [32000,37000,42000,46000,50000,52300],
    labels30d: ['6/28','7/03','7/08','7/13','7/18','7/23'],
    trend7d: [45000,47000,49000,50000,51200,52000,52300],
    labels7d: ['7/21','7/22','7/23','7/24','7/25','7/26','7/27'],
    hourLikes: [40,30,20,12,8,5,10,25,80,180,280,380,480,550,520,420,380,500,620,780,880,750,500,250],
    delta: -400, deltaUp: false, totalWorks: 4,
    works: [
      { title:'黑暗料理让他先尝', likes:22000, plays:620000, date:'2026-07-21 20:45', week:30, url:'https://www.kuaishou.com/short-video/ks123' },
      { title:'假装把工资花光了', likes:15000, plays:380000, date:'2026-07-08 19:30', week:28, url:'https://www.kuaishou.com/short-video/ks456' },
    ]
  },
};

let state = { accounts: MOCK_ACCOUNTS(), selectedId: 'all', trendMode: 'all' };

function MOCK_ACCOUNTS() {
  return [
    { id:'a1', platform:'douyin', nickname:'我的抖音', userId:'49566173638', fans:125600, delta:+3200, deltaUp:true, works:12 },
    { id:'a2', platform:'xiaohongshu', nickname:'我的小红书', userId:'95886844869', fans:86400, delta:+1500, deltaUp:true, works:8 },
    { id:'a3', platform:'kuaishou', nickname:'我的快手', userId:'5530272280', fans:52300, delta:-400, deltaUp:false, works:4 },
  ];
}

function fmt(n) {
  if (n>=100000000) return (n/100000000).toFixed(1)+'亿';
  if (n>=10000) return (n/10000).toFixed(1)+'w';
  return String(n);
}

// ====== 账号卡片 ======
function renderCards() {
  const el = document.getElementById('acctCards');
  let html = `
    <div class="monitor-card all${state.selectedId==='all'?' selected':''}" onclick="selectAcct('all')">
      <div class="mc-platform">全部账号</div>
      <div class="mc-fans">${fmt(state.accounts.reduce((s,a)=>s+a.fans,0))}<span class="mc-delta up">+${fmt(state.accounts.reduce((s,a)=>s+ (a.deltaUp?Math.abs(a.delta):0),0))}</span></div>
      <div class="mc-sub">${state.accounts.length} 个账号</div>
    </div>`;
  state.accounts.forEach(a => {
    const dStr = a.deltaUp ? `+${fmt(a.delta)}` : `${fmt(a.delta)}`;
    const dCls = a.deltaUp ? 'up' : 'down';
    html += `<div class="monitor-card${state.selectedId===a.id?' selected':''}" onclick="selectAcct('${a.id}')" style="border-left:3px solid ${PLAT_COLORS[a.platform]};">
      <div class="mc-platform">${PLAT_NAMES[a.platform]}</div>
      <div class="mc-fans">${fmt(a.fans)}<span class="mc-delta ${dCls}">${dStr}</span></div>
      <div class="mc-sub">${a.nickname} · ${a.works}条作品</div>
    </div>`;
  });
  html += `<div class="monitor-card add" onclick="openModal()"><span class="add-icon">+</span>添加账号</div>`;
  el.innerHTML = html;
  document.getElementById('acctCount').textContent = state.accounts.length;
}

// ====== 获取当前选中数据 ======
function getData() {
  if (state.selectedId === 'all') {
    // 合并所有账号
    const maxLen = Math.max(...state.accounts.map(a => (ACCOUNT_DATA[a.id]?.allLabels||[]).length));
    const mergedAll = [];
    for (let i=0; i<maxLen; i++) {
      let sum=0; state.accounts.forEach(a => {
        const ad = ACCOUNT_DATA[a.id]; if (!ad) return;
        const idx = Math.min(i, ad.fans.length-1); sum += ad.fans[idx];
      }); mergedAll.push(sum);
    }
    const merged30d = []; for (let i=0; i<6; i++) { let s=0; state.accounts.forEach(a=>{const ad=ACCOUNT_DATA[a.id]; if(ad) s+=(ad.trend30d?.[i]||0);}); merged30d.push(s); }
    const merged7d = []; for (let i=0; i<7; i++) { let s=0; state.accounts.forEach(a=>{const ad=ACCOUNT_DATA[a.id]; if(ad) s+=(ad.trend7d?.[i]||0);}); merged7d.push(s); }
    const mergedHours = new Array(24).fill(0);
    state.accounts.forEach(a=>{ const ad=ACCOUNT_DATA[a.id]; if(ad&&ad.hourLikes) ad.hourLikes.forEach((v,i)=>{mergedHours[i]+=v;}); });
    return { fans:mergedAll, labels30d: ['6/28','7/03','7/08','7/13','7/18','7/23'], trend30d:merged30d, labels7d: ['7/21','7/22','7/23','7/24','7/25','7/26','7/27'], trend7d:merged7d, hourLikes:mergedHours,
      allLabels: ['1月','2月','3月','4月','5月','6月上','6月下','7/27'], nickname:'全部账号', platform:'all' };
  }
  const d = ACCOUNT_DATA[state.selectedId];
  return { ...d, nickname: d.nickname, platform: d.platform };
}

// ====== 选中账号 ======
function selectAcct(id) {
  state.selectedId = id;
  renderCards();
  drawTrend();
  drawTimeSlot();
  renderAdvice();
  renderWeekGroups();
}

// ====== 趋势切换 ======
function switchTrend(mode) {
  state.trendMode = mode;
  document.querySelectorAll('.tseg-btn').forEach((b,i)=>{
    const modes=['all','30d','7d']; b.classList.toggle('active', modes[i]===mode);
  });
  const titles = { all: '📈 全部趋势', '30d': '📈 近30天趋势', '7d': '📈 近7天趋势' };
  const subs = { all: '发布至今', '30d': '近30天每日', '7d': '近7天每日' };
  document.getElementById('trendTitle').innerHTML = titles[mode] + ' <span class="chart-sub">' + subs[mode] + '</span>';
  drawTrend();
}

// ====== 趋势图 ======
function drawTrend() {
  const c = document.getElementById('trendCanvas');
  const ctx = c.getContext('2d');
  const W=c.width, H=c.height;
  const pad={top:24, right:20, bottom:32, left:44};
  const pw=W-pad.left-pad.right, ph=H-pad.top-pad.bottom;

  const d = getData();
  let values, labels;
  if (state.trendMode==='all') { values=d.fans; labels=d.allLabels; }
  else if (state.trendMode==='30d') { values=d.trend30d; labels=d.labels30d; }
  else { values=d.trend7d; labels=d.labels7d; }

  ctx.clearRect(0,0,W,H);

  const maxV=values[values.length-1]*1.12, minV=values[0]*0.88;
  // Grid
  ctx.strokeStyle='#e5e5ea'; ctx.lineWidth=1;
  for (let i=0; i<=4; i++) {
    const y=pad.top+(ph/4)*i;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
    ctx.fillStyle='#86868b'; ctx.font='10px -apple-system'; ctx.textAlign='right';
    ctx.fillText(Math.round((maxV-(maxV-minV)*i/4)/1000)+'k', pad.left-6, y+4);
  }
  // X labels
  ctx.textAlign='center'; ctx.fillStyle='#86868b';
  const step = Math.max(1, Math.floor(labels.length/6));
  labels.forEach((l,i)=>{ if(i%step===0){ const x=pad.left+(pw/(labels.length-1))*i; ctx.fillText(l, x, H-6); } });

  // Line
  const pts = values.map((v,i)=>({ x:pad.left+(pw/(values.length-1))*i, y:pad.top+ph-((v-minV)/(maxV-minV))*ph }));
  ctx.beginPath(); ctx.moveTo(pts[0].x, pad.top+ph);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x, pad.top+ph); ctx.closePath();
  const g=ctx.createLinearGradient(0,pad.top,0,pad.top+ph);
  g.addColorStop(0,'rgba(0,113,227,0.18)'); g.addColorStop(1,'rgba(0,113,227,0.01)');
  ctx.fillStyle=g; ctx.fill();

  ctx.beginPath(); ctx.strokeStyle='#0071e3'; ctx.lineWidth=2.5; ctx.lineJoin='round';
  pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();

  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#0071e3'; ctx.lineWidth=2; ctx.stroke(); });

  // Last label
  const last=pts[pts.length-1];
  ctx.fillStyle='#0071e3'; ctx.font='bold 11px -apple-system'; ctx.textAlign='left';
  ctx.fillText(fmt(values[values.length-1]), last.x+6, last.y-6);
}

// ====== 时段图 ======
function drawTimeSlot() {
  const c=document.getElementById('timeSlotCanvas');
  const ctx=c.getContext('2d');
  const W=c.width, H=c.height;
  const pad={top:12, right:15, bottom:26, left:38};
  const pw=W-pad.left-pad.right, ph=H-pad.top-pad.bottom;
  const d=getData();
  const hourLikes=d.hourLikes;
  const maxV=Math.max(...hourLikes);

  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#e5e5ea'; ctx.lineWidth=1;
  for (let i=0; i<=3; i++) {
    const y=pad.top+(ph/3)*i;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
    ctx.fillStyle='#86868b'; ctx.font='9px -apple-system'; ctx.textAlign='right';
    ctx.fillText(Math.round(maxV-(maxV/3)*i), pad.left-5, y+3);
  }
  const barW=Math.max(5,Math.floor(pw/24)-2), gap=Math.max(1,(pw-barW*24)/23);
  hourLikes.forEach((v,i)=>{
    const x=pad.left+(barW+gap)*i, h=(v/maxV)*ph, y=pad.top+ph-h;
    let color='#d0d0d5';
    if (v>=maxV*0.85) color='#34c759'; else if (v>=maxV*0.5) color='#0071e3'; else if (v<=maxV*0.1) color='#ff3b30';
    ctx.fillStyle=color; roundRect(ctx,x,y,barW,Math.max(1,h),2); ctx.fill();
    if (i%3===0) { ctx.fillStyle='#86868b'; ctx.font='9px -apple-system'; ctx.textAlign='center'; ctx.fillText(i+':00', x+barW/2, H-5); }
  });
  // Legend
  ctx.fillStyle='#34c759'; ctx.fillRect(pad.left,4,8,8);
  ctx.fillStyle='#86868b'; ctx.font='10px -apple-system'; ctx.textAlign='left'; ctx.fillText('最佳时段',pad.left+12,12);
  ctx.fillStyle='#ff3b30'; ctx.fillRect(pad.left+70,4,8,8); ctx.fillText('低效时段',pad.left+82,12);
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

// ====== 作品按周分组 ======
function getISOWeek(dateStr) {
  const d = new Date(dateStr);
  const start = new Date(d.getFullYear(), 0, 1);
  const diff = (d - start + (start.getTimezoneOffset()-d.getTimezoneOffset())*60000) / 86400000;
  return Math.ceil((diff + start.getDay() + 1) / 7);
}

function renderWeekGroups() {
  const el=document.getElementById('weekGroups');
  let works=[];
  if (state.selectedId==='all') { state.accounts.forEach(a=>{ const ad=ACCOUNT_DATA[a.id]; if(ad) works.push(...ad.works.map(w=>({...w,platform:ad.platform,author:ad.nickname})));
  });} else { const ad=ACCOUNT_DATA[state.selectedId]; if(ad) works=ad.works.map(w=>({...w,platform:ad.platform,author:ad.nickname})); }
  document.getElementById('workTotal').textContent='共 '+works.length+' 条';

  const groups={};
  works.forEach(w=>{
    const week = getISOWeek(w.date);
    const y=2026;
    const key= y+'-W'+String(week).padStart(2,'0');
    if(!groups[key]) groups[key]={week,works:[],firstDate:w.date};
    groups[key].works.push(w);
  });
  const sorted=Object.keys(groups).sort((a,b)=>b.localeCompare(a)); // 倒序

  if(!sorted.length) { el.innerHTML='<p style="text-align:center;color:#86868b;padding:30px;">暂无作品数据</p>'; return; }

  el.innerHTML=sorted.map(key=>{
    const g=groups[key];
    const year=2026, wk=g.week;
    // 算该周的日期范围
    const jan1=new Date(year,0,1); const dayOffset=(wk-1)*7 - jan1.getDay() + 1;
    const mon=new Date(year,0,1+dayOffset); const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    const fmtDate=d=>`${(d.getMonth()+1)}/${d.getDate()}`;
    return `<div class="week-group">
      <div class="week-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="week-head-left">
          <span class="week-num">${year}年第${wk}周</span>
          <span class="week-range">${fmtDate(mon)} - ${fmtDate(sun)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="week-badge">${g.works.length}条</span>
          <span class="week-arrow">▼</span>
        </div>
      </div>
      <div class="week-body">${g.works.map(w=>renderWorkCard(w)).join('')}</div>
    </div>`;
  }).join('');
}

function renderWorkCard(w) {
  const color=PLAT_COLORS[w.platform]||'#ccc';
  return `<div class="video-card" style="cursor:default;">
    <div class="card-cover-area" style="min-height:90px;background:linear-gradient(135deg,${color}22,${color}08);">
      <span style="font-size:36px;">🎬</span>
      <span style="position:absolute;top:10px;right:10px;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600;color:#fff;background:${color}88;">${PLAT_NAMES[w.platform]}</span>
    </div>
    <div class="card-body"><div class="card-title">${w.title}</div><div class="card-author"><span class="author-name">${w.author}</span></div></div>
    <div class="card-stats"><span class="stat-item"><span class="stat-icon">❤️</span>${fmt(w.likes)}</span><span class="stat-item"><span class="stat-icon">▶️</span>${fmt(w.plays)}</span><span class="stat-time">${w.date.slice(5)}</span></div>
    <a href="${w.url||'#'}" class="work-link" target="_blank" onclick="event.stopPropagation()">📱 在${PLAT_NAMES[w.platform]}查看原视频 · ${PLAT_DOMAINS[w.platform]}</a>
  </div>`;
}
